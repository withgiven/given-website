<!DOCTYPE html>

	<title>Given</title>

		body {
			margin: 0;
			padding: 0 1.5rem;
			height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			font-family: system-ui, -apple-system, sans-serif;
			color: #111827;
		}

		h1 {
			max-width: 42rem;
			text-align: center;
			font-size: 1.25rem;
			font-weight: 300;
			line-height: 1.75;
			letter-spacing: 0.025em;
			opacity: 0;
		}

		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(20px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.fadeInUp {
			animation: fadeInUp 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
		}

		.delay-100 {
			animation-delay: 0.1s;
		}
	</style>
</head>
